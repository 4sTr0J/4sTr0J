<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Technology matrix: Cyber Security, Network Forensics, Security Software, Cryptography and AI">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    @keyframes fill { from { width: 0; } }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateX(-1600px); } to { transform: translateX(1600px); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .c1 { animation: rise .8s ease-out .2s both; }
    .c2 { animation: rise .8s ease-out .45s both; }
    .c3 { animation: rise .8s ease-out .7s both; }
    .c4 { animation: rise .8s ease-out .95s both; }
    .bar { animation: fill 1.8s cubic-bezier(.2,.7,.2,1) 1.2s both; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .sweep { animation: sweep 6s linear infinite; }
    .f1 { animation: float 5s ease-in-out infinite; }
    .f2 { animation: float 5s ease-in-out 1.2s infinite; }
    .f3 { animation: float 5s ease-in-out 2.4s infinite; }
    .f4 { animation: float 5s ease-in-out 3.6s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020508"/>
      <stop offset="0.5" stop-color="#050e14"/>
      <stop offset="1" stop-color="#040b10"/>
    </linearGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff66"/><stop offset="1" stop-color="#70ffaf"/></linearGradient>
    <linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#80f7ff"/></linearGradient>
    <linearGradient id="sw" x1="0" x2="1">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0"/><stop offset=".5" stop-color="#00ff66" stop-opacity=".06"/><stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#00ff66" fill-opacity=".08"/></pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#dots)"/>
    <rect class="sweep" width="500" height="900" fill="url(#sw)"/>

    <g class="sans">
      <text class="mono c1" x="80" y="110" font-size="20" fill="#00ff66" letter-spacing="6">// 0x02 — WEAPONRY &amp; TOOLSET</text>
      <text class="c1" x="78" y="180" font-size="60" font-weight="800" fill="#fff" letter-spacing="-1.5">Tools I defend &amp; attack with</text>
      <g class="c1 mono" font-size="17" fill="#80a095">
        <circle cx="1320" cy="104" r="6" fill="#00ff66" class="live"/>
        <text x="1520" y="110" text-anchor="end">SEC_MONITOR // ACTIVE</text>
      </g>
    </g>

    <!-- Card 01: Offensive Security -->
    <g class="c1"><g class="f1">
      <rect x="80" y="240" width="700" height="290" rx="24" fill="#03080e" stroke="#00ff66" stroke-opacity=".4"/>
      <text class="mono" x="116" y="292" font-size="16" fill="#00ff66" letter-spacing="4">01 · OFFENSIVE SECURITY &amp; CTF</text>
      <text class="sans" x="116" y="340" font-size="34" font-weight="700" fill="#fff">Penetration testing &amp; exploits</text>
      <g class="mono" font-size="18" fill="#e6f5ee">
        <text x="116" y="398">TryHackMe · CTF</text><rect x="360" y="386" width="380" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="360" y="386" width="360" height="10" rx="5" fill="url(#g)"/>
        <text x="116" y="440">BurpSuite · Metasploit</text><rect x="360" y="428" width="380" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="360" y="428" width="330" height="10" rx="5" fill="url(#g)"/>
        <text x="116" y="482">Nmap · Recon &amp; Enum</text><rect x="360" y="470" width="380" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="360" y="470" width="345" height="10" rx="5" fill="url(#g)"/>
      </g>
    </g></g>

    <!-- Card 02: Network Forensics & SOC -->
    <g class="c2"><g class="f2">
      <rect x="820" y="240" width="700" height="290" rx="24" fill="#03080e" stroke="#00e5ff" stroke-opacity=".4"/>
      <text class="mono" x="856" y="292" font-size="16" fill="#00e5ff" letter-spacing="4">02 · NETWORK DEFENSE &amp; SOC</text>
      <text class="sans" x="856" y="340" font-size="34" font-weight="700" fill="#fff">Packet forensics &amp; routing</text>
      <g class="mono" font-size="18" fill="#e6f5ee">
        <text x="856" y="398">CCNA · Routing &amp; Switch</text><rect x="1120" y="386" width="360" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1120" y="386" width="335" height="10" rx="5" fill="url(#c)"/>
        <text x="856" y="440">Wireshark · Traffic Analysis</text><rect x="1120" y="428" width="360" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1120" y="428" width="320" height="10" rx="5" fill="url(#c)"/>
        <text x="856" y="482">Docker · Isolated Sandboxes</text><rect x="1120" y="470" width="360" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1120" y="470" width="300" height="10" rx="5" fill="url(#c)"/>
      </g>
    </g></g>

    <!-- Card 03: Security Software -->
    <g class="c3"><g class="f3">
      <rect x="80" y="560" width="700" height="290" rx="24" fill="#03080e" stroke="#00e5ff" stroke-opacity=".4"/>
      <text class="mono" x="116" y="612" font-size="16" fill="#00e5ff" letter-spacing="4">03 · SECURITY SOFTWARE</text>
      <text class="sans" x="116" y="660" font-size="34" font-weight="700" fill="#fff">Python tooling &amp; backends</text>
      <g class="mono" font-size="17">
        <rect x="116" y="696" width="130" height="44" rx="12" fill="#00e5ff" fill-opacity=".12"/><text x="181" y="724" text-anchor="middle" fill="#00e5ff">Python</text>
        <rect x="260" y="696" width="120" height="44" rx="12" fill="#00e5ff" fill-opacity=".12"/><text x="320" y="724" text-anchor="middle" fill="#00e5ff">Java</text>
        <rect x="394" y="696" width="140" height="44" rx="12" fill="#00e5ff" fill-opacity=".12"/><text x="464" y="724" text-anchor="middle" fill="#00e5ff">Linux Bash</text>
        <rect x="548" y="696" width="140" height="44" rx="12" fill="#00e5ff" fill-opacity=".12"/><text x="618" y="724" text-anchor="middle" fill="#00e5ff">Docker</text>
        <rect x="116" y="756" width="140" height="44" rx="12" fill="#00e5ff" fill-opacity=".12"/><text x="186" y="784" text-anchor="middle" fill="#00e5ff">JavaScript</text>
        <rect x="270" y="756" width="150" height="44" rx="12" fill="#00e5ff" fill-opacity=".12"/><text x="345" y="784" text-anchor="middle" fill="#00e5ff">REST APIs</text>
        <rect x="434" y="756" width="120" height="44" rx="12" fill="#00e5ff" fill-opacity=".12"/><text x="494" y="784" text-anchor="middle" fill="#00e5ff">Git</text>
      </g>
    </g></g>

    <!-- Card 04: Data & Cryptography -->
    <g class="c4"><g class="f4">
      <rect x="820" y="560" width="700" height="290" rx="24" fill="#03080e" stroke="#00ff66" stroke-opacity=".4"/>
      <text class="mono" x="856" y="612" font-size="16" fill="#00ff66" letter-spacing="4">04 · CRYPTO, DATA &amp; AI</text>
      <text class="sans" x="856" y="660" font-size="34" font-weight="700" fill="#fff">NLP &amp; vulnerability audit</text>
      <g class="mono" font-size="17">
        <rect x="856" y="696" width="160" height="44" rx="12" fill="#00ff66" fill-opacity=".12"/><text x="936" y="724" text-anchor="middle" fill="#70ffaf">Cryptography</text>
        <rect x="1030" y="696" width="170" height="44" rx="12" fill="#00ff66" fill-opacity=".12"/><text x="1115" y="724" text-anchor="middle" fill="#70ffaf">Tkinter GUI</text>
        <rect x="1214" y="696" width="160" height="44" rx="12" fill="#00ff66" fill-opacity=".12"/><text x="1294" y="724" text-anchor="middle" fill="#70ffaf">NLP Engine</text>
        <rect x="856" y="756" width="130" height="44" rx="12" fill="#00ff66" fill-opacity=".12"/><text x="921" y="784" text-anchor="middle" fill="#70ffaf">MySQL</text>
        <rect x="1000" y="756" width="140" height="44" rx="12" fill="#00ff66" fill-opacity=".12"/><text x="1070" y="784" text-anchor="middle" fill="#70ffaf">MongoDB</text>
        <rect x="1154" y="756" width="160" height="44" rx="12" fill="#00ff66" fill-opacity=".12"/><text x="1234" y="784" text-anchor="middle" fill="#70ffaf">Sec Auditing</text>
      </g>
    </g></g>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#00ff66" stroke-opacity=".18" stroke-width="2"/>
  </g>
</svg>
