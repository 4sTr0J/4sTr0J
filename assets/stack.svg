<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Technology matrix: frontend, backend, cloud and DevOps, AI and data">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    @keyframes fill { from { width: 0; } }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateX(-1600px); } to { transform: translateX(1600px); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .c1 { animation: rise .8s ease-out .2s both; }
    .c2 { animation: rise .8s ease-out .45s both; }
    .c3 { animation: rise .8s ease-out .7s both; }
    .c4 { animation: rise .8s ease-out .95s both; }
    .bar { animation: fill 1.8s cubic-bezier(.2,.7,.2,1) 1.2s both; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .sweep { animation: sweep 6s linear infinite; }
    .f1 { animation: float 5s ease-in-out infinite; }
    .f2 { animation: float 5s ease-in-out 1.2s infinite; }
    .f3 { animation: float 5s ease-in-out 2.4s infinite; }
    .f4 { animation: float 5s ease-in-out 3.6s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/><stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="o" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#1E90FF"/><stop offset="1" stop-color="#7cc0ff"/></linearGradient>
    <linearGradient id="sw" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#dots)"/>
    <rect class="sweep" width="500" height="900" fill="url(#sw)"/>

    <g class="sans">
      <text class="mono c1" x="80" y="110" font-size="20" fill="#F7941D" letter-spacing="6">// 02 — TECHNOLOGY MATRIX</text>
      <text class="c1" x="78" y="180" font-size="60" font-weight="800" fill="#fff" letter-spacing="-1.5">The tools I build with</text>
      <g class="c1 mono" font-size="17" fill="#8b93a7">
        <circle cx="1352" cy="104" r="6" fill="#28c840" class="live"/>
        <text x="1520" y="110" text-anchor="end">ACTIVELY USED</text>
      </g>
    </g>

    <!-- Card template: x, y, 680x300 -->
    <!-- Cyber Security -->
    <g class="c1"><g class="f1">
      <rect x="80" y="240" width="700" height="290" rx="24" fill="#0b0f18" stroke="#F7941D" stroke-opacity=".35"/>
      <text class="mono" x="116" y="292" font-size="16" fill="#F7941D" letter-spacing="4">01 · CYBER SECURITY</text>
      <text class="sans" x="116" y="340" font-size="34" font-weight="700" fill="#fff">Defend, analyze &amp; break</text>
      <g class="mono" font-size="18" fill="#e6e9f0">
        <text x="116" y="398">TryHackMe · CTF</text><rect x="340" y="386" width="400" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="340" y="386" width="370" height="10" rx="5" fill="url(#o)"/>
        <text x="116" y="440">Wireshark · Blue Team</text><rect x="340" y="428" width="400" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="340" y="428" width="350" height="10" rx="5" fill="url(#o)"/>
        <text x="116" y="482">AppSec · Cryptography</text><rect x="340" y="470" width="400" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="340" y="470" width="310" height="10" rx="5" fill="url(#o)"/>
      </g>
    </g></g>

    <!-- Network & Cloud -->
    <g class="c2"><g class="f2">
      <rect x="820" y="240" width="700" height="290" rx="24" fill="#0b0f18" stroke="#1E90FF" stroke-opacity=".35"/>
      <text class="mono" x="856" y="292" font-size="16" fill="#7cc0ff" letter-spacing="4">02 · NETWORK &amp; CLOUD</text>
      <text class="sans" x="856" y="340" font-size="34" font-weight="700" fill="#fff">Resilient infrastructure</text>
      <g class="mono" font-size="18" fill="#e6e9f0">
        <text x="856" y="398">CCNA · Routing &amp; Switch</text><rect x="1120" y="386" width="360" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1120" y="386" width="330" height="10" rx="5" fill="url(#b)"/>
        <text x="856" y="440">Docker · Containers</text><rect x="1120" y="428" width="360" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1120" y="428" width="310" height="10" rx="5" fill="url(#b)"/>
        <text x="856" y="482">GCloud · Linux Admin</text><rect x="1120" y="470" width="360" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1120" y="470" width="280" height="10" rx="5" fill="url(#b)"/>
      </g>
    </g></g>

    <!-- Software Development -->
    <g class="c3"><g class="f3">
      <rect x="80" y="560" width="700" height="290" rx="24" fill="#0b0f18" stroke="#1E90FF" stroke-opacity=".35"/>
      <text class="mono" x="116" y="612" font-size="16" fill="#7cc0ff" letter-spacing="4">03 · SOFTWARE DEVELOPMENT</text>
      <text class="sans" x="116" y="660" font-size="34" font-weight="700" fill="#fff">Clean, scalable code</text>
      <g class="mono" font-size="17">
        <rect x="116" y="696" width="130" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="181" y="724" text-anchor="middle" fill="#7cc0ff">Python</text>
        <rect x="260" y="696" width="120" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="320" y="724" text-anchor="middle" fill="#7cc0ff">Java</text>
        <rect x="394" y="696" width="150" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="469" y="724" text-anchor="middle" fill="#7cc0ff">JavaScript</text>
        <rect x="558" y="696" width="130" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="623" y="724" text-anchor="middle" fill="#7cc0ff">React</text>
        <rect x="116" y="756" width="140" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="186" y="784" text-anchor="middle" fill="#7cc0ff">Node.js</text>
        <rect x="270" y="756" width="150" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="345" y="784" text-anchor="middle" fill="#7cc0ff">REST APIs</text>
        <rect x="434" y="756" width="120" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="494" y="784" text-anchor="middle" fill="#7cc0ff">Git</text>
      </g>
    </g></g>

    <!-- AI & Data -->
    <g class="c4"><g class="f4">
      <rect x="820" y="560" width="700" height="290" rx="24" fill="#0b0f18" stroke="#F7941D" stroke-opacity=".35"/>
      <text class="mono" x="856" y="612" font-size="16" fill="#F7941D" letter-spacing="4">04 · AI, DATA &amp; TOOLS</text>
      <text class="sans" x="856" y="660" font-size="34" font-weight="700" fill="#fff">NLP &amp; intelligent tools</text>
      <g class="mono" font-size="17">
        <rect x="856" y="696" width="140" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="926" y="724" text-anchor="middle" fill="#ffb35c">NLP</text>
        <rect x="1010" y="696" width="170" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1095" y="724" text-anchor="middle" fill="#ffb35c">Tkinter GUI</text>
        <rect x="1194" y="696" width="180" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1284" y="724" text-anchor="middle" fill="#ffb35c">Sec Analysis</text>
        <rect x="856" y="756" width="130" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="921" y="784" text-anchor="middle" fill="#ffb35c">MySQL</text>
        <rect x="1000" y="756" width="140" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1070" y="784" text-anchor="middle" fill="#ffb35c">MongoDB</text>
        <rect x="1154" y="756" width="130" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1219" y="784" text-anchor="middle" fill="#ffb35c">Linux Bash</text>
      </g>
    </g></g>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  </g>
</svg>
