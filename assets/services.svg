<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Security operations: From vulnerability recon to hardened systems">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes dash { to { stroke-dashoffset: -320; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes glow { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: .95; } }
    .n1 { animation: rise .8s ease-out .2s both; }
    .n2 { animation: rise .8s ease-out .5s both; }
    .n3 { animation: rise .8s ease-out .8s both; }
    .n4 { animation: rise .8s ease-out 1.1s both; }
    .n5 { animation: rise .8s ease-out 1.4s both; }
    .flow { stroke-dasharray: 8 12; animation: dash 5s linear infinite; }
    .live { animation: pulse 1.8s ease-in-out infinite; }
    .core { animation: glow 3s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020508"/>
      <stop offset="0.5" stop-color="#050e14"/>
      <stop offset="1" stop-color="#040b10"/>
    </linearGradient>
    <radialGradient id="coreG"><stop offset="0" stop-color="#00ff66" stop-opacity=".35"/><stop offset="1" stop-color="#00ff66" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00ff66" stroke-opacity=".04"/></pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <circle cx="800" cy="520" r="300" fill="url(#coreG)"/>

    <g class="n1 sans">
      <text class="mono" x="80" y="110" font-size="20" fill="#00ff66" letter-spacing="6">// 0x03 — SECURITY CAPABILITIES // OPERATIONAL DOMAINS</text>
      <text x="78" y="180" font-size="60" font-weight="800" fill="#fff" letter-spacing="-1.5">From vulnerability recon to hardened systems</text>
    </g>

    <!-- Flow lines from core to services -->
    <g fill="none" stroke-width="2.5">
      <path class="flow" d="M800 520 C620 520 560 330 400 330" stroke="#00ff66" stroke-opacity=".7"/>
      <path class="flow" d="M800 520 C980 520 1040 330 1200 330" stroke="#00e5ff" stroke-opacity=".7"/>
      <path class="flow" d="M800 520 C620 520 560 720 400 720" stroke="#00e5ff" stroke-opacity=".7"/>
      <path class="flow" d="M800 520 C980 520 1040 720 1200 720" stroke="#00ff66" stroke-opacity=".7"/>
    </g>

    <!-- Core -->
    <g class="n2">
      <circle class="core" cx="800" cy="520" r="112" fill="#03080e" stroke="#00ff66" stroke-width="2.5"/>
      <circle cx="800" cy="520" r="88" fill="none" stroke="#00e5ff" stroke-opacity=".15"/>
      <text class="sans" x="800" y="508" text-anchor="middle" font-size="20" fill="#80a095">TARGET</text>
      <text class="sans" x="800" y="546" text-anchor="middle" font-size="34" font-weight="800" fill="#00ff66">SYSTEM</text>
    </g>

    <!-- Service nodes: 420x150 -->
    <g class="n3">
      <rect x="80" y="255" width="420" height="150" rx="22" fill="#03080e" stroke="#00ff66" stroke-opacity=".45"/>
      <text class="mono" x="112" y="298" font-size="15" fill="#00ff66" letter-spacing="3">RECON &amp; PENTEST</text>
      <text class="sans" x="112" y="338" font-size="28" font-weight="700" fill="#fff">Vulnerability Testing</text>
      <text class="sans" x="112" y="372" font-size="18" fill="#80a095">Port scans · Exploit analysis · Pass analyzers</text>
    </g>
    <g class="n3">
      <rect x="1100" y="255" width="420" height="150" rx="22" fill="#03080e" stroke="#00e5ff" stroke-opacity=".45"/>
      <text class="mono" x="1132" y="298" font-size="15" fill="#00e5ff" letter-spacing="3">NETWORK DEFENSE</text>
      <text class="sans" x="1132" y="338" font-size="28" font-weight="700" fill="#fff">Packet Forensics &amp; SOC</text>
      <text class="sans" x="1132" y="372" font-size="18" fill="#80a095">CCNA routing · Wireshark packet inspection</text>
    </g>
    <g class="n4">
      <rect x="80" y="645" width="420" height="150" rx="22" fill="#03080e" stroke="#00e5ff" stroke-opacity=".45"/>
      <text class="mono" x="112" y="688" font-size="15" fill="#00e5ff" letter-spacing="3">CONTAINER SECURITY</text>
      <text class="sans" x="112" y="728" font-size="28" font-weight="700" fill="#fff">Sandboxed Systems</text>
      <text class="sans" x="112" y="762" font-size="18" fill="#80a095">Docker isolation · Microservices · GCloud</text>
    </g>
    <g class="n4">
      <rect x="1100" y="645" width="420" height="150" rx="22" fill="#03080e" stroke="#00ff66" stroke-opacity=".45"/>
      <text class="mono" x="1132" y="688" font-size="15" fill="#00ff66" letter-spacing="3">SECURE DEVELOPMENT</text>
      <text class="sans" x="1132" y="728" font-size="28" font-weight="700" fill="#fff">Hardened Applications</text>
      <text class="sans" x="1132" y="762" font-size="18" fill="#80a095">Java banking backends · Python NLP engines</text>
    </g>

    <!-- status chip -->
    <g class="n5 mono" font-size="17">
      <rect x="1180" y="88" width="340" height="46" rx="23" fill="#00ff66" fill-opacity=".1" stroke="#00ff66" stroke-opacity=".5"/>
      <circle cx="1210" cy="111" r="6" fill="#00ff66" class="live"/>
      <text x="1230" y="117" fill="#00ff66">ENGAGED IN DEFENSE &amp; DEV</text>
    </g>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#00ff66" stroke-opacity=".18" stroke-width="2"/>
  </g>
</svg>
