<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Cyber Defense Architecture: From vulnerability recon to hardened systems">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes dash { to { stroke-dashoffset: -320; } }
    @keyframes dashRev { to { stroke-dashoffset: 320; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes glowCore { 0%,100% { stroke-opacity: .4; transform: scale(.98); } 50% { stroke-opacity: 1; transform: scale(1.02); } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes packetFlow { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
    
    .n1 { animation: rise .8s ease-out .2s both; }
    .n2 { animation: rise .8s ease-out .4s both; }
    .n3 { animation: rise .8s ease-out .6s both; }
    .n4 { animation: rise .8s ease-out .8s both; }
    .n5 { animation: rise .8s ease-out 1.0s both; }
    
    .circuitFlow { stroke-dasharray: 8 16; animation: dash 4s linear infinite; }
    .circuitFlowRev { stroke-dasharray: 8 16; animation: dashRev 4s linear infinite; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .coreHex { transform-box: fill-box; transform-origin: 50% 50%; animation: glowCore 3s ease-in-out infinite; }
    .reticleSlow { transform-origin: 800px 520px; animation: spinSlow 30s linear infinite; }
    .reticleRev { transform-origin: 800px 520px; animation: spinRev 20s linear infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020508"/>
      <stop offset="0.5" stop-color="#050e14"/>
      <stop offset="1" stop-color="#03080e"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ff66" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moduleGlowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ff66" stop-opacity=".08"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moduleGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff66" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <circle cx="800" cy="520" r="320" fill="url(#coreGlow)"/>

    <!-- Header Section -->
    <g class="n1 sans">
      <text class="mono" x="80" y="105" font-size="20" fill="#00ff66" letter-spacing="6">// 0x03 — SECURITY_TOPOLOGY // ZERO_TRUST_ARCHITECTURE</text>
      <text x="78" y="175" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">From vulnerability recon to hardened architectures</text>
    </g>

    <!-- Top Status Indicator Badge -->
    <g class="n5 mono" font-size="16">
      <rect x="1140" y="80" width="380" height="46" rx="10" fill="#03080e" stroke="#00ff66" stroke-opacity=".5"/>
      <circle cx="1170" cy="103" r="6" fill="#00ff66" class="live"/>
      <text x="1190" y="109" fill="#00ff66">DEFENSE_GRID: MAXIMUM_LOCKDOWN</text>
    </g>

    <!-- ========================================================= -->
    <!--            HIGH-TECH CIRCUIT / CONDUIT TRACES             -->
    <!-- ========================================================= -->
    <g fill="none" stroke-width="2.5">
      <!-- Trace 1: Core to Top-Left (Recon Module) -->
      <path d="M720 480 L620 480 L520 380 L380 380" stroke="#00ff66" stroke-opacity=".2"/>
      <path class="circuitFlow" d="M720 480 L620 480 L520 380 L380 380" stroke="#00ff66" stroke-opacity=".85"/>
      <circle cx="620" cy="480" r="4" fill="#00ff66"/>
      <circle cx="520" cy="380" r="4" fill="#00ff66"/>

      <!-- Trace 2: Core to Top-Right (Network Defense) -->
      <path d="M880 480 L980 480 L1080 380 L1220 380" stroke="#00e5ff" stroke-opacity=".2"/>
      <path class="circuitFlow" d="M880 480 L980 480 L1080 380 L1220 380" stroke="#00e5ff" stroke-opacity=".85"/>
      <circle cx="980" cy="480" r="4" fill="#00e5ff"/>
      <circle cx="1080" cy="380" r="4" fill="#00e5ff"/>

      <!-- Trace 3: Core to Bottom-Left (Container Security) -->
      <path d="M720 560 L620 560 L520 660 L380 660" stroke="#00e5ff" stroke-opacity=".2"/>
      <path class="circuitFlowRev" d="M720 560 L620 560 L520 660 L380 660" stroke="#00e5ff" stroke-opacity=".85"/>
      <circle cx="620" cy="560" r="4" fill="#00e5ff"/>
      <circle cx="520" cy="660" r="4" fill="#00e5ff"/>

      <!-- Trace 4: Core to Bottom-Right (Hardened Dev) -->
      <path d="M880 560 L980 560 L1080 660 L1220 660" stroke="#00ff66" stroke-opacity=".2"/>
      <path class="circuitFlowRev" d="M880 560 L980 560 L1080 660 L1220 660" stroke="#00ff66" stroke-opacity=".85"/>
      <circle cx="980" cy="560" r="4" fill="#00ff66"/>
      <circle cx="1080" cy="660" r="4" fill="#00ff66"/>
    </g>

    <!-- ========================================================= -->
    <!--           CENTRAL CORE: HEXAGONAL CYBER REACTOR           -->
    <!-- ========================================================= -->
    <g class="n2">
      <!-- Outer Reticle Crosshairs and Degree Ticks -->
      <circle cx="800" cy="520" r="145" fill="none" stroke="#00ff66" stroke-opacity=".15" stroke-dasharray="2 8"/>
      <g class="reticleSlow">
        <circle cx="800" cy="520" r="128" fill="none" stroke="#00ff66" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="8 12"/>
        <circle cx="928" cy="520" r="4" fill="#00ff66"/>
        <circle cx="672" cy="520" r="4" fill="#00ff66"/>
      </g>
      <g class="reticleRev">
        <circle cx="800" cy="520" r="110" fill="none" stroke="#00e5ff" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="24 16"/>
      </g>

      <!-- Central Hexagon Core Body -->
      <polygon class="coreHex" points="850,433 900,520 850,607 750,607 700,520 750,433" fill="#03080e" stroke="#00ff66" stroke-width="2.5"/>
      <polygon points="838,446 882,520 838,594 762,594 718,520 762,446" fill="none" stroke="#00e5ff" stroke-opacity=".3" stroke-width="1.5"/>

      <!-- Center Shield & Root Core Readout -->
      <g transform="translate(800 488)">
        <!-- Cyber Shield Icon -->
        <path d="M0 -14 L14 -7 V4 C14 14 0 20 0 20 C0 20 -14 14 -14 4 V-7 Z" fill="#00ff66" fill-opacity=".2" stroke="#00ff66" stroke-width="2"/>
        <circle cx="0" cy="2" r="3" fill="#00ff66"/>
      </g>

      <text class="mono" x="800" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="#80a095" letter-spacing="2">ZERO_TRUST</text>
      <text class="sans" x="800" y="562" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="1">DEFENSE CORE</text>
      <text class="mono" x="800" y="582" text-anchor="middle" font-size="12" fill="#00ff66">DMZ // ISOLATED</text>
    </g>

    <!-- ========================================================= -->
    <!--            4 TACTICAL CYBER HUD MODULE PANELS             -->
    <!-- ========================================================= -->

    <!-- MODULE 01: Top-Left (Offensive Recon & Pentest) -->
    <g class="n3">
      <rect x="70" y="240" width="550" height="190" rx="14" fill="#03080e" stroke="#00ff66" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="70" y="240" width="550" height="190" rx="14" fill="url(#moduleGlowG)"/>
      
      <!-- Tactical Corner Brackets -->
      <path d="M82 252 H74 V260" fill="none" stroke="#00ff66" stroke-width="2"/>
      <path d="M608 252 H616 V260" fill="none" stroke="#00ff66" stroke-width="2"/>
      <path d="M74 418 V426 H82" fill="none" stroke="#00ff66" stroke-width="2"/>
      <path d="M616 418 V426 H608" fill="none" stroke="#00ff66" stroke-width="2"/>

      <!-- Header Chip & Port Tag -->
      <rect x="94" y="260" width="140" height="26" rx="6" fill="#00ff66" fill-opacity=".15"/>
      <text class="mono" x="164" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#00ff66">0x01 // RECON</text>
      <text class="mono" x="596" y="278" text-anchor="end" font-size="13" fill="#80a095">TARGET: 10.10.14.0/24</text>

      <!-- Titles & Description -->
      <text class="sans" x="94" y="322" font-size="28" font-weight="700" fill="#ffffff">Offensive Recon &amp; Pentest</text>
      <text class="sans" x="94" y="354" font-size="17" fill="#80a095">Port scans · Exploit payloads · NIST entropy analyzers</text>

      <!-- Status Footer Bar -->
      <circle cx="102" cy="392" r="4.5" fill="#00ff66" class="live"/>
      <text class="mono" x="116" y="396" font-size="13" fill="#00ff66">AUDIT: ACTIVE</text>
      <text class="mono" x="340" y="396" font-size="13" fill="#80a095">TOOLS: Nmap · Metasploit · Burp</text>
    </g>

    <!-- MODULE 02: Top-Right (Network Defense & SOC) -->
    <g class="n3">
      <rect x="980" y="240" width="550" height="190" rx="14" fill="#03080e" stroke="#00e5ff" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="980" y="240" width="550" height="190" rx="14" fill="url(#moduleGlowC)"/>
      
      <!-- Tactical Corner Brackets -->
      <path d="M992 252 H984 V260" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <path d="M1518 252 H1526 V260" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <path d="M984 418 V426 H992" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <path d="M1526 418 V426 H1518" fill="none" stroke="#00e5ff" stroke-width="2"/>

      <!-- Header Chip & Net Tag -->
      <rect x="1004" y="260" width="140" height="26" rx="6" fill="#00e5ff" fill-opacity=".15"/>
      <text class="mono" x="1074" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#00e5ff">0x02 // NETSEC</text>
      <text class="mono" x="1506" y="278" text-anchor="end" font-size="13" fill="#80a095">IFACE: ETH0_PROMISCUOUS</text>

      <!-- Titles & Description -->
      <text class="sans" x="1004" y="322" font-size="28" font-weight="700" fill="#ffffff">Network Forensics &amp; SOC</text>
      <text class="sans" x="1004" y="354" font-size="17" fill="#80a095">CCNA routing &amp; switching · Wireshark packet stream analysis</text>

      <!-- Status Footer Bar -->
      <circle cx="1012" cy="392" r="4.5" fill="#00e5ff" class="live"/>
      <text class="mono" x="1026" y="396" font-size="13" fill="#00e5ff">FLOW: 12.8 MB/s</text>
      <text class="mono" x="1260" y="396" font-size="13" fill="#80a095">FIREWALL: SYN_FLOOD_BLOCK</text>
    </g>

    <!-- MODULE 03: Bottom-Left (Container Security & Cloud) -->
    <g class="n4">
      <rect x="70" y="615" width="550" height="190" rx="14" fill="#03080e" stroke="#00e5ff" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="70" y="615" width="550" height="190" rx="14" fill="url(#moduleGlowC)"/>
      
      <!-- Tactical Corner Brackets -->
      <path d="M82 627 H74 V635" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <path d="M608 627 H616 V635" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <path d="M74 793 V801 H82" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <path d="M616 793 V801 H608" fill="none" stroke="#00e5ff" stroke-width="2"/>

      <!-- Header Chip & Host Tag -->
      <rect x="94" y="635" width="150" height="26" rx="6" fill="#00e5ff" fill-opacity=".15"/>
      <text class="mono" x="169" y="653" text-anchor="middle" font-size="13" font-weight="700" fill="#00e5ff">0x03 // SANDBOX</text>
      <text class="mono" x="596" y="653" text-anchor="end" font-size="13" fill="#80a095">ISOLATION: SEPARATE_NAMESPACES</text>

      <!-- Titles & Description -->
      <text class="sans" x="94" y="697" font-size="28" font-weight="700" fill="#ffffff">Container Security &amp; Cloud</text>
      <text class="sans" x="94" y="729" font-size="17" fill="#80a095">Docker container isolation · Hardened Linux microservices</text>

      <!-- Status Footer Bar -->
      <circle cx="102" cy="767" r="4.5" fill="#00e5ff" class="live"/>
      <text class="mono" x="116" y="771" font-size="13" fill="#00e5ff">SELINUX: ENFORCING</text>
      <text class="mono" x="350" y="771" font-size="13" fill="#80a095">KERNEL: CAP_DROP_ALL</text>
    </g>

    <!-- MODULE 04: Bottom-Right (Hardened Development & Crypto) -->
    <g class="n4">
      <rect x="980" y="615" width="550" height="190" rx="14" fill="#03080e" stroke="#00ff66" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="980" y="615" width="550" height="190" rx="14" fill="url(#moduleGlowG)"/>
      
      <!-- Tactical Corner Brackets -->
      <path d="M992 627 H984 V635" fill="none" stroke="#00ff66" stroke-width="2"/>
      <path d="M1518 627 H1526 V635" fill="none" stroke="#00ff66" stroke-width="2"/>
      <path d="M984 793 V801 H992" fill="none" stroke="#00ff66" stroke-width="2"/>
      <path d="M1526 793 V801 H1518" fill="none" stroke="#00ff66" stroke-width="2"/>

      <!-- Header Chip & Crypto Tag -->
      <rect x="1004" y="635" width="140" height="26" rx="6" fill="#00ff66" fill-opacity=".15"/>
      <text class="mono" x="1074" y="653" text-anchor="middle" font-size="13" font-weight="700" fill="#00ff66">0x04 // APPSEC</text>
      <text class="mono" x="1506" y="653" text-anchor="end" font-size="13" fill="#80a095">CIPHER: AES-GCM-256</text>

      <!-- Titles & Description -->
      <text class="sans" x="1004" y="697" font-size="28" font-weight="700" fill="#ffffff">Hardened Software &amp; Crypto</text>
      <text class="sans" x="1004" y="729" font-size="17" fill="#80a095">Java banking transactional engines · Python NLP threat modeling</text>

      <!-- Status Footer Bar -->
      <circle cx="1012" cy="767" r="4.5" fill="#00ff66" class="live"/>
      <text class="mono" x="1026" y="771" font-size="13" fill="#00ff66">INTEGRITY: SHA-256</text>
      <text class="mono" x="1270" y="771" font-size="13" fill="#80a095">TRANSACTIONS: ACID_VERIFIED</text>
    </g>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#00ff66" stroke-opacity=".2" stroke-width="2"/>
  </g>
</svg>
