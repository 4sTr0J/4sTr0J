<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Nadil Kularathne — Cyber Security and Network Defense Engineer">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,-30px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,30px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes scan { from { transform: translateY(-900px); } to { transform: translateY(900px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -400; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbA { animation: drift 12s ease-in-out infinite; }
    .orbB { animation: drift2 14s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    .r1 { animation: rise .9s ease-out .2s both; }
    .r2 { animation: rise .9s ease-out .5s both; }
    .r3 { animation: rise .9s ease-out .8s both; }
    .r4 { animation: rise .9s ease-out 1.1s both; }
    .r5 { animation: rise .9s ease-out 1.4s both; }
    .l1 { animation: rise .4s ease-out 1.8s both; }
    .l2 { animation: rise .4s ease-out 2.4s both; }
    .l3 { animation: rise .4s ease-out 3.0s both; }
    .l4 { animation: rise .4s ease-out 3.6s both; }
    .l5 { animation: rise .4s ease-out 4.2s both; }
    .cursor { animation: blink 1s step-end infinite; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 10; animation: dash 6s linear infinite; }
    .ring { transform-origin: 1290px 250px; animation: spin 24s linear infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020508"/>
      <stop offset="0.5" stop-color="#050e14"/>
      <stop offset="1" stop-color="#040b10"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ff66" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#99ffc2"/>
      <stop offset="1" stop-color="#00ff66"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff66" stop-opacity=".09"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff66" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <circle class="orbA" cx="1250" cy="200" r="380" fill="url(#glowG)"/>
    <circle class="orbB" cx="260" cy="780" r="420" fill="url(#glowC)"/>
    <rect class="scan" width="1600" height="260" fill="url(#scanG)"/>

    <!-- Top bar -->
    <g class="mono r1" font-size="18" fill="#80a095">
      <circle cx="80" cy="70" r="7" fill="#00ff66" class="live"/>
      <text x="100" y="76">4STR0J // CYBER SECURITY &amp; OFFENSIVE RECON</text>
      <text x="1520" y="76" text-anchor="end">SYS.ROOT // SEC_CLEARANCE_LVL3 // UTC+05:30</text>
    </g>
    <line x1="64" y1="106" x2="1536" y2="106" stroke="#00ff66" stroke-opacity=".15"/>

    <!-- Left: identity -->
    <g class="sans">
      <text class="mono r1" x="80" y="240" font-size="22" fill="#00ff66" letter-spacing="6">// 0x01_IDENT // ROOT_OPERATOR</text>
      <text class="r2" x="76" y="345" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-3">Nadil</text>
      <text class="r2" x="76" y="450" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-3">Kularathne</text>
      <g class="r3">
        <rect x="80" y="490" width="6" height="64" rx="3" fill="#00ff66"/>
        <text x="106" y="518" font-size="28" fill="#e6f5ee" font-weight="600">Cyber Security &amp; Network Defense</text>
        <text x="106" y="552" font-size="22" fill="#80a095">Penetration Testing · CTF Player · CCNA · Exploit Dev · Python</text>
      </g>
      <!-- chips -->
      <g class="r4 mono" font-size="17">
        <rect x="80" y="600" width="220" height="44" rx="22" fill="#00ff66" fill-opacity=".12" stroke="#00ff66" stroke-opacity=".55"/>
        <text x="190" y="628" text-anchor="middle" fill="#00ff66">TryHackMe · CTF</text>
        <rect x="314" y="600" width="180" height="44" rx="22" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" stroke-opacity=".55"/>
        <text x="404" y="628" text-anchor="middle" fill="#00e5ff">CCNA · NetOps</text>
        <rect x="508" y="600" width="190" height="44" rx="22" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".25"/>
        <text x="603" y="628" text-anchor="middle" fill="#e6f5ee">Python · Docker</text>
      </g>
      <g class="r5 mono" font-size="20" fill="#80a095">
        <text x="80" y="760"><tspan fill="#00ff66">▸</tspan> Offensive security, packet analysis &amp; threat mitigation</text>
        <text x="80" y="800"><tspan fill="#00ff66">▸</tspan> Real-time password analyzers, secure banking &amp; NLP pipelines</text>
      </g>
    </g>

    <!-- Right: radar orbit + terminal -->
    <g class="ring" opacity=".8">
      <circle cx="1290" cy="250" r="150" fill="none" stroke="#00ff66" stroke-opacity=".35" stroke-dasharray="3 14"/>
      <circle cx="1440" cy="250" r="7" fill="#00ff66"/>
      <circle cx="1290" cy="100" r="6" fill="#00e5ff"/>
      <line x1="1290" y1="100" x2="1290" y2="400" stroke="#00ff66" stroke-opacity=".2" stroke-dasharray="4 6"/>
      <line x1="1140" y1="250" x2="1440" y2="250" stroke="#00ff66" stroke-opacity=".2" stroke-dasharray="4 6"/>
    </g>
    <circle cx="1290" cy="250" r="96" fill="none" stroke="#00e5ff" stroke-opacity=".35"/>
    <text x="1290" y="262" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#00ff66">&lt;SEC/&gt;</text>

    <g class="r3">
      <rect x="880" y="430" width="660" height="400" rx="22" fill="#03080e" fill-opacity=".95" stroke="#00ff66" stroke-opacity=".25"/>
      <rect x="880" y="430" width="660" height="54" rx="22" fill="#00ff66" fill-opacity=".06"/>
      <circle cx="914" cy="457" r="8" fill="#ff4d6d"/>
      <circle cx="942" cy="457" r="8" fill="#febc2e"/>
      <circle cx="970" cy="457" r="8" fill="#00ff66"/>
      <text x="1210" y="463" text-anchor="middle" class="mono" font-size="16" fill="#80a095">root@4sTr0J:~# (kali-linux)</text>

      <g class="mono" font-size="19">
        <g transform="translate(910 530)">
          <text fill="#00ff66"># <tspan fill="#e6f5ee">whoami</tspan></text>
        </g>
        <text class="l1" x="910" y="566" fill="#80a095">4sTr0J — offensive security, network forensics &amp; exploit analysis</text>
        <text class="l2" x="910" y="610" fill="#00ff66"># <tspan fill="#e6f5ee">nmap -sV -sC target.local</tspan></text>
        <text class="l3" x="910" y="646" fill="#00e5ff">[+] PORT 22/tcp (SSH) | PORT 443/tcp (SSL/TLS)</text>
        <text class="l3" x="910" y="676" fill="#00e5ff">[+] RECON_SUITE: [Wireshark, BurpSuite, Metasploit, CCNA]</text>
        <text class="l3" x="910" y="706" fill="#00e5ff">[+] CVE_SCAN: 0 unpatched · banking &amp; auth verified</text>
        <text class="l4" x="910" y="750" fill="#00ff66"># <tspan fill="#e6f5ee">./pwn --target challenge --exploit</tspan></text>
        <text class="l5" x="910" y="790" fill="#00ff66">&gt; ROOT ACCESS GRANTED · flag{4sTr0J_sec}<tspan class="cursor" fill="#00ff66"> ▍</tspan></text>
      </g>
    </g>

    <!-- connector -->
    <path class="flow" d="M1290 346 C1290 390 1210 400 1210 430" fill="none" stroke="#00ff66" stroke-opacity=".7" stroke-width="2"/>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#00ff66" stroke-opacity=".18" stroke-width="2"/>
  </g>
</svg>
