<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Nadil Kularathne — Cyber Security and Network Defense Engineer">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-20px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes scan { from { transform: translateY(-900px); } to { transform: translateY(900px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blip { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes wave { 0% { r: 4px; opacity: 1; } 100% { r: 24px; opacity: 0; } }
    .orbA { animation: drift 14s ease-in-out infinite; }
    .scan { animation: scan 6s linear infinite; }
    .r1 { animation: rise .8s ease-out .2s both; }
    .r2 { animation: rise .8s ease-out .4s both; }
    .r3 { animation: rise .8s ease-out .6s both; }
    .r4 { animation: rise .8s ease-out .8s both; }
    .r5 { animation: rise .8s ease-out 1.0s both; }
    .cursor { animation: blink 1s step-end infinite; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .radar { transform-origin: 1380px 220px; animation: spin 5s linear infinite; }
    .blipPulse { transform-box: fill-box; transform-origin: 50% 50%; animation: blip 1.8s ease-in-out infinite; }
    .blipWave { transform-box: fill-box; transform-origin: 50% 50%; animation: wave 2.2s cubic-bezier(0,0.2,0.8,1) infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020508"/>
      <stop offset="0.5" stop-color="#050e14"/>
      <stop offset="1" stop-color="#03080e"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ff66" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#a3ffcb"/>
      <stop offset="1" stop-color="#00ff66"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff66" stop-opacity=".08"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff66" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff66" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <circle class="orbA" cx="1380" cy="220" r="340" fill="url(#glowG)"/>
    <circle class="orbA" cx="240" cy="740" r="380" fill="url(#glowC)"/>
    <rect class="scan" width="1600" height="260" fill="url(#scanG)"/>

    <!-- Top Tactical Bar -->
    <g class="mono r1" font-size="17" fill="#80a095">
      <circle cx="80" cy="70" r="6" fill="#00ff66" class="live"/>
      <text x="100" y="76">4STR0J // CYBER SECURITY &amp; OFFENSIVE RECON</text>
      <text x="1520" y="76" text-anchor="end">SYS.ROOT // SEC_CLEARANCE_LVL0 // UTC+05:30</text>
    </g>
    <line x1="64" y1="106" x2="1536" y2="106" stroke="#00ff66" stroke-opacity=".2"/>

    <!-- Tactical Corner Accents on Identity Box -->
    <path d="M72 190 H64 V230" fill="none" stroke="#00ff66" stroke-width="2"/>
    <path d="M64 800 V840 H72" fill="none" stroke="#00ff66" stroke-width="2"/>

    <!-- Left: Identity -->
    <g class="sans">
      <text class="mono r1" x="80" y="235" font-size="20" fill="#00ff66" letter-spacing="5">// 0x01_OPERATOR // ROOT_ACCESS</text>
      <text class="r2" x="76" y="340" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-3">Nadil</text>
      <text class="r2" x="76" y="445" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-3">Kularathne</text>
      
      <g class="r3">
        <rect x="80" y="485" width="6" height="64" rx="3" fill="#00ff66"/>
        <text x="106" y="513" font-size="28" fill="#e6f5ee" font-weight="600">Cyber Security &amp; Network Defense</text>
        <text x="106" y="547" font-size="22" fill="#80a095">Penetration Testing · CTF Player · CCNA · Exploit Dev · Python</text>
      </g>
      
      <!-- Chamfered-style Chips -->
      <g class="r4 mono" font-size="16">
        <rect x="80" y="595" width="220" height="42" rx="10" fill="#00ff66" fill-opacity=".1" stroke="#00ff66" stroke-opacity=".5"/>
        <text x="190" y="622" text-anchor="middle" fill="#00ff66">TryHackMe · CTF</text>
        
        <rect x="314" y="595" width="180" height="42" rx="10" fill="#00e5ff" fill-opacity=".1" stroke="#00e5ff" stroke-opacity=".5"/>
        <text x="404" y="622" text-anchor="middle" fill="#00e5ff">CCNA · NetOps</text>
        
        <rect x="508" y="595" width="190" height="42" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".2"/>
        <text x="603" y="622" text-anchor="middle" fill="#e6f5ee">Python · Docker</text>
      </g>
      
      <g class="r5 mono" font-size="19" fill="#80a095">
        <text x="80" y="745"><tspan fill="#00ff66">▸</tspan> Offensive security, packet analysis &amp; threat mitigation</text>
        <text x="80" y="785"><tspan fill="#00ff66">▸</tspan> Real-time password analyzers, secure banking &amp; NLP pipelines</text>
        <text x="80" y="825"><tspan fill="#00e5ff">▸</tspan> System clearance: LEVEL_0 [UNRESTRICTED_ROOT]</text>
      </g>
    </g>

    <!-- ========================================================= -->
    <!--          RIGHT TOP: CYBER DEFENSE RADAR HUD               -->
    <!-- ========================================================= -->

    <!-- Telemetry Status Panel (Left of Radar) -->
    <g class="r2 mono" font-size="15" fill="#80a095">
      <rect x="840" y="145" width="270" height="150" rx="14" fill="#03080e" stroke="#00ff66" stroke-opacity=".25"/>
      <text x="860" y="180"><tspan fill="#00ff66">RADAR:</tspan> 360° SCANNING</text>
      <text x="860" y="212"><tspan fill="#ff4d6d">TARGETS:</tspan> 3 DISCOVERED</text>
      <text x="860" y="244"><tspan fill="#00e5ff">NET_MODE:</tspan> PROMISCUOUS</text>
      <text x="860" y="276"><tspan fill="#00ff66">STATUS:</tspan> DEFENSE_OPTIMAL</text>
    </g>

    <!-- Radar Sonar Housing (cx=1380, cy=220) -->
    <g class="r2">
      <!-- Outer Compass Rings -->
      <circle cx="1380" cy="220" r="130" fill="#03080e" fill-opacity=".8" stroke="#00ff66" stroke-opacity=".4" stroke-width="2"/>
      <circle cx="1380" cy="220" r="90" fill="none" stroke="#00ff66" stroke-opacity=".2" stroke-dasharray="3 6"/>
      <circle cx="1380" cy="220" r="50" fill="none" stroke="#00ff66" stroke-opacity=".25"/>
      <circle cx="1380" cy="220" r="10" fill="#00ff66" fill-opacity=".4"/>

      <!-- Crosshairs -->
      <line x1="1230" y1="220" x2="1530" y2="220" stroke="#00ff66" stroke-opacity=".25" stroke-dasharray="2 4"/>
      <line x1="1380" y1="70" x2="1380" y2="370" stroke="#00ff66" stroke-opacity=".25" stroke-dasharray="2 4"/>

      <!-- Degree Labels -->
      <g class="mono" font-size="11" fill="#80a095">
        <text x="1380" y="86" text-anchor="middle">000°</text>
        <text x="1514" y="224">090°</text>
        <text x="1380" y="358" text-anchor="middle">180°</text>
        <text x="1246" y="224" text-anchor="end">270°</text>
      </g>

      <!-- Rotating 360° Radar Sweep Cone -->
      <g class="radar">
        <line x1="1380" y1="220" x2="1510" y2="220" stroke="#00ff66" stroke-width="2"/>
        <path d="M1380 220 L1510 220 A130 130 0 0 0 1472 128 Z" fill="url(#radarSweepGrad)"/>
      </g>

      <!-- Target Blip 1: Vulnerable Port (Red) -->
      <g transform="translate(1440 160)">
        <circle cx="0" cy="0" r="5" fill="#ff4d6d" class="blipPulse"/>
        <circle cx="0" cy="0" r="10" fill="none" stroke="#ff4d6d" stroke-width="1.5" class="blipWave"/>
        <text x="12" y="4" class="mono" font-size="12" fill="#ff4d6d">445/SMB [VULN]</text>
      </g>

      <!-- Target Blip 2: Network Gateway (Cyan) -->
      <g transform="translate(1310 270)">
        <circle cx="0" cy="0" r="4.5" fill="#00e5ff" class="blipPulse"/>
        <text x="-95" y="4" class="mono" font-size="12" fill="#00e5ff">GATEWAY:OK</text>
      </g>

      <!-- Target Blip 3: Secure Host (Green) -->
      <g transform="translate(1420 280)">
        <circle cx="0" cy="0" r="4.5" fill="#00ff66" class="blipPulse"/>
        <text x="12" y="4" class="mono" font-size="12" fill="#00ff66">HOST:SECURE</text>
      </g>
    </g>

    <!-- ========================================================= -->
    <!--         RIGHT BOTTOM: KALI EXPLOIT CONSOLE                -->
    <!-- ========================================================= -->

    <g class="r3">
      <!-- Window Container -->
      <rect x="780" y="420" width="760" height="420" rx="20" fill="#03080e" fill-opacity=".96" stroke="#00ff66" stroke-opacity=".35"/>
      <!-- Window Title Bar -->
      <rect x="780" y="420" width="760" height="52" rx="20" fill="#00ff66" fill-opacity=".06"/>
      <circle cx="814" cy="446" r="8" fill="#ff4d6d"/>
      <circle cx="842" cy="446" r="8" fill="#febc2e"/>
      <circle cx="870" cy="446" r="8" fill="#00ff66"/>
      
      <!-- Multi-tab Labels in Header -->
      <g class="mono" font-size="14">
        <rect x="900" y="432" width="160" height="28" rx="6" fill="#00ff66" fill-opacity=".15"/>
        <text x="980" y="451" text-anchor="middle" fill="#00ff66">root@4sTr0J (zsh)</text>
        <text x="1130" y="451" fill="#80a095">nmap_scan.log</text>
        <text x="1280" y="451" fill="#80a095">wireshark.pcap</text>
        <text x="1510" y="451" text-anchor="end" fill="#00e5ff">ETH0: 10.10.14.8</text>
      </g>

      <!-- Terminal Output Content -->
      <g class="mono" font-size="18">
        <text x="814" y="515" fill="#00ff66"># <tspan fill="#e6f5ee">whoami</tspan></text>
        <text class="r4" x="814" y="548" fill="#80a095">4sTr0J — offensive security, network forensics &amp; exploit analysis</text>
        
        <text class="r4" x="814" y="595" fill="#00ff66"># <tspan fill="#e6f5ee">nmap -sS -A target.lab</tspan></text>
        <text class="r5" x="814" y="628" fill="#00e5ff">[+] 22/tcp OPEN ssh · 443/tcp OPEN https · 8080/tcp proxy</text>
        <text class="r5" x="814" y="658" fill="#00e5ff">[+] CVE_AUDIT: 0 unpatched · banking &amp; auth verified</text>
        
        <text class="r5" x="814" y="705" fill="#00ff66"># <tspan fill="#e6f5ee">./pwn --target challenge --exploit</tspan></text>
        <text class="r5" x="814" y="738" fill="#80a095">[*] Sending payload (Python/Reverse_TCP) -&gt; session opened</text>
        <text class="r5" x="814" y="774" fill="#00ff66">&gt; [ROOT ACCESS GRANTED] · flag{4sTr0J_k1ll_ch41n}<tspan class="cursor" fill="#00ff66"> ▍</tspan></text>
      </g>
    </g>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#00ff66" stroke-opacity=".2" stroke-width="2"/>
  </g>
</svg>
